<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<style>
:root{--g:#2e7d32;--g2:#e8f5e9;--bd:#cfd8cf;--tx:#1b2b1b;--mut:#6a766a;--bg:#f4f7f4;--warn:#b26a00;--bad:#b3261e}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:Tahoma,"Segoe UI",Arial,sans-serif;background:var(--bg);color:var(--tx);padding-bottom:24px;font-size:15px}
header{background:var(--g);color:#fff;padding:10px 14px;position:relative;z-index:20;display:flex;justify-content:space-between;align-items:center;gap:8px}
header h1{font-size:17px;margin:0}
header button{background:rgba(255,255,255,.18);color:#fff;border:0;border-radius:8px;padding:7px 12px;font:inherit}
nav{position:sticky;top:0;display:flex;overflow-x:auto;background:#fff;border-bottom:1px solid var(--bd);box-shadow:0 2px 6px rgba(0,0,0,.06);z-index:20;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{flex:1 0 auto;min-width:64px;padding:12px 10px 9px;border:0;background:none;font:inherit;font-size:14px;color:var(--mut);border-bottom:3px solid transparent;white-space:nowrap}
nav button.on{color:var(--g);font-weight:700;border-bottom-color:var(--g);background:var(--g2)}
main{padding:12px;max-width:1100px;margin:0 auto}
select,input,textarea{font:inherit;padding:9px;border:1px solid var(--bd);border-radius:8px;width:100%;background:#fff;color:var(--tx)}
textarea{min-height:70px;resize:vertical}
label{display:block;font-size:13px;color:var(--mut);margin-bottom:2px}
.btn{background:var(--g);color:#fff;border:0;border-radius:9px;padding:11px 16px;font:inherit;font-weight:700;cursor:pointer}
.btn.sec{background:#fff;color:var(--g);border:1px solid var(--g)}
.btn.warn{background:#fff;color:var(--bad);border:1px solid var(--bad)}
.btn.sm{padding:7px 10px;font-size:13px;font-weight:600}
.link{background:none;border:0;color:var(--g);font:inherit;font-size:14px;padding:6px 0;cursor:pointer;text-align:right}
.card{background:#fff;border:1px solid var(--bd);border-radius:12px;padding:12px;margin:10px 0}
.card h3{margin:0 0 8px;font-size:16px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.mut{color:var(--mut);font-size:13px}
.bar{display:grid;gap:8px;margin-bottom:8px}
.wn{display:grid;grid-template-columns:auto 1fr auto;gap:6px;align-items:center;margin:8px 0}
.wn .btn{padding:9px 12px}
details.day{background:#fff;border:1px solid var(--bd);border-radius:10px;margin:8px 0}
details.day>summary{padding:12px;cursor:pointer;list-style:none;display:flex;justify-content:space-between;gap:8px;align-items:center}
details.day>summary::-webkit-details-marker{display:none}
details.day.today{border-color:var(--g);box-shadow:0 0 0 1px var(--g)}
details.day .dn{font-weight:700}
details.day .dsum{font-size:12.5px;color:var(--mut);text-align:left}
details.day.has>summary{background:var(--g2);border-radius:10px}
.day .body{padding:4px 12px 12px;display:grid;gap:8px}
.sub{font-weight:700;color:var(--g);margin-top:4px}
.fr{display:grid;grid-template-columns:1fr 92px;gap:6px}
.hid{display:none}
.pk{position:relative;min-width:0}.pk .pki{width:100%}
.pkl{position:absolute;right:0;left:0;top:100%;z-index:40;background:#fff;border:1px solid var(--bd);border-radius:10px;max-height:240px;overflow:auto;box-shadow:0 6px 18px rgba(0,0,0,.18);margin-top:2px}
.pko{display:flex;justify-content:space-between;gap:8px;padding:11px 12px;border-bottom:1px solid #eee;cursor:pointer}
.pko small{color:var(--mut);white-space:nowrap}.pkn{color:#1b5e20;font-weight:700}
.sr{border-top:1px dashed var(--bd);padding-top:6px;margin-top:6px}
.savebar{position:fixed;right:0;left:0;bottom:env(safe-area-inset-bottom);background:#fff;border-top:1px solid var(--bd);padding:8px 12px;display:flex;gap:8px;z-index:15;justify-content:center}
.savebar .btn{flex:1;max-width:260px}
.savebar.dirty{background:#fff8e1;border-top-color:#f9a825}
.tw{overflow:auto;border:1px solid var(--bd);border-radius:10px;background:#fff;max-height:70vh}
table.t{border-collapse:collapse;font-size:13px;width:100%}
table.t th,table.t td{border:1px solid #e1e6e1;padding:6px 8px;text-align:center;white-space:nowrap}
table.t th{background:var(--g2);position:sticky;top:0;z-index:2}
table.t td:first-child,table.t th:first-child{position:sticky;right:0;background:#fff;text-align:right;font-weight:600;z-index:1}
table.t th:first-child{background:var(--g2);z-index:3}
table.t tr.tot td{background:#fff3cd;font-weight:700}
table.t td.ann,table.t th.ann{background:#fff3cd;font-weight:700}
table.wo td{white-space:normal;text-align:right;vertical-align:top;min-width:70px}
table.wo td:first-child{white-space:nowrap}
.chip{display:inline-block;background:var(--g2);color:var(--g);border-radius:20px;padding:2px 10px;font-size:12.5px}
.chip.s1{background:#fff3cd;color:#7a5200}.chip.s2{background:#c8e6c9;color:#1b5e20}.chip.s3{background:#fde0dc;color:var(--bad)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:50;display:flex;align-items:center;justify-content:center;padding:14px}
.mbox{background:#fff;border-radius:14px;padding:16px;width:100%;max-width:440px;max-height:90vh;overflow:auto;display:grid;gap:10px}
.mbox h3{margin:0}
.chk{display:grid;grid-template-columns:1fr 1fr;gap:4px}
.chk label{display:flex;gap:6px;align-items:center;color:var(--tx);font-size:14px}
.chk input{width:auto}
#busy{position:fixed;top:60px;left:50%;transform:translateX(-50%);background:#263238;color:#fff;padding:8px 16px;border-radius:20px;z-index:60;display:none}
#toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:#263238;color:#fff;padding:10px 18px;border-radius:10px;z-index:60;display:none;max-width:90%;text-align:center}
#login{max-width:420px;margin:40px auto;padding:0 16px}
.croprow{display:grid;grid-template-columns:1fr 90px auto;gap:6px;margin-bottom:6px}
.hero{background:linear-gradient(135deg,#2e7d32,#558b2f);color:#fff;border-radius:14px;padding:14px;margin:10px 0}
.hero h2{margin:0 0 4px;font-size:18px}
.hero .st{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.hero .st span{background:rgba(255,255,255,.2);border-radius:20px;padding:4px 12px;font-size:13px}
.hc{background:#fff;border:1px solid var(--bd);border-radius:14px;margin:12px 0;overflow:hidden}
.hc>.hh{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 12px;background:var(--g2);border-bottom:1px solid var(--bd)}
.hc>.hh b{font-size:16px;color:#1b5e20}
.hc table{border-collapse:collapse;width:100%;min-width:680px;font-size:13.5px}
.hc td.dy,.hc th:first-child{position:sticky;right:0;background:#fff;z-index:1;box-shadow:-1px 0 0 #e1e6e1}
.hc th:first-child{background:#f6faf6}
.hc tr.em td.dy{background:#fafbfa}.hc tr.td td.dy{background:#fffde7}
.hc td:nth-child(2){min-width:80px}.hc td:nth-child(3){min-width:85px;white-space:nowrap}.hc td:nth-child(4){min-width:130px}.hc td:nth-child(5){min-width:150px}.hc td:nth-child(6){min-width:110px}
.hc th{background:#f6faf6;color:var(--mut);font-weight:600;padding:7px 8px;text-align:right;border-bottom:1px solid #e1e6e1;white-space:nowrap}
.hc td{padding:8px;border-bottom:1px solid #eef2ee;vertical-align:top;text-align:right}
.hc tr:last-child td{border-bottom:0}
.hc td.dy{white-space:nowrap;font-weight:700;color:#1b5e20}
.hc td.dy small{display:block;font-weight:400;color:var(--mut)}
.hc tr.em td{color:#b0b8b0;background:#fafbfa}
.hc tr.td td{background:#fffde7}
.tg{display:inline-block;border-radius:8px;padding:2px 8px;margin:1px 0;font-size:12.5px;line-height:1.5}
.tg.ir{background:#e3f2fd;color:#0d47a1}.tg.fe{background:#e8f5e9;color:#1b5e20}.tg.sp{background:#fff3e0;color:#a24a00}.tg.me{background:#f3e5f5;color:#6a1b9a}
.hnone{display:flex;justify-content:space-between;align-items:center;background:#fff;border:1px dashed var(--bd);border-radius:12px;padding:10px 12px;margin:8px 0;color:var(--mut)}
.userrow{display:grid;grid-template-columns:104px 1fr 1fr auto;gap:6px;margin-bottom:6px}
.itemrow{display:grid;grid-template-columns:1fr 1fr 80px 80px auto;gap:6px;margin-bottom:6px}
.subtabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:6px}
.subtabs button{flex:0 0 auto;border:1px solid var(--bd);background:#fff;border-radius:20px;padding:8px 14px;font:inherit;font-size:14px;color:var(--mut)}
.subtabs button.on{background:var(--g);color:#fff;border-color:var(--g)}
.reql{display:grid;gap:6px;border-top:1px solid #e8ece8;padding:10px 0}
.reql:first-of-type{border-top:0}
.reql .top{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.reql .go{display:grid;grid-template-columns:1fr 1fr auto;gap:6px;align-items:center}
.lowc{color:var(--bad);font-weight:700}
.okc{color:var(--g);font-weight:700}
.seg{display:flex;gap:6px;margin:8px 0}
.seg button{flex:1;border:1px solid var(--bd);background:#fff;border-radius:9px;padding:9px;font:inherit;color:var(--mut)}
.seg button.on{background:var(--g);color:#fff;border-color:var(--g)}
.row3s{display:grid;grid-template-columns:1fr 80px 80px;gap:6px}
@media print{header,nav,.noprint,.savebar,#busy,#toast{display:none!important}body{background:#fff;padding:0}.card{border:0;padding:0}.tw{max-height:none;border:0}table.t th{position:static}}
</style>
</head>
<body>

<div id="login" style="display:none">
  <div class="card">
    <div style="text-align:center"><img src="icon-192.png" width="96" height="96" alt="" style="border-radius:22px"></div>
    <h3 dir="ltr" style="text-align:center">San Mark Fertilization &amp; Spraying</h3>
    <div class="seg"><button id="mAdm" class="on">مدير (كود سري)</button><button id="mSto">دخول بالموبايل</button></div>
    <p class="mut" id="lHint">أول مرة بس: اكتب الكود السري.</p>
    <div id="lApiWrap"><label>رابط Web app (Apps Script)</label>
    <input id="lApi" dir="ltr" placeholder="https://script.google.com/macros/s/.../exec"></div>
    <div id="lCodeWrap"><label style="margin-top:8px">الكود السري</label>
    <input id="lCode" dir="ltr" type="password"></div>
    <div id="lPhoneWrap" style="display:none"><label style="margin-top:8px">رقم الموبايل المسجّل</label>
    <input id="lPhone" dir="ltr" type="tel" inputmode="tel" placeholder="01xxxxxxxxx"></div>
    <p id="lErr" style="color:var(--bad)"></p>
    <button class="btn" id="lGo" style="width:100%">دخول</button>
  </div>
</div>

<div id="app" style="display:none">
  <header>
    <div style="display:flex;align-items:center;gap:8px"><img src="icon-192.png" width="32" height="32" alt="" style="border-radius:8px"><h1 dir="ltr">San Mark Fertilization &amp; Spraying</h1></div>
    <span><small style="opacity:.7">نسخة 8</small> <button id="reload">تحديث</button> <button id="hout" style="display:none">خروج</button></span>
  </header>
  <nav id="nav"></nav>
  <main id="view"></main>
</div>
<div id="busy">جاري التحميل…</div>
<div id="toast"></div>

<script>
// ممكن تحط رابط الـ Web app هنا بدل ما تكتبه في الشاشة الأولى
const API_DEFAULT = 'https://script.google.com/macros/s/AKfycbyr_Uwx_mvJnRzBFF1WIN1nNZu8-tc28IzPaFIy6C7vSNJfCLSP9dxF9XhTuNNGdlVJWA/exec';

/* ================= أدوات ================= */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2, '0');
const iso = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const parse = s => { const [y, m, d] = String(s).split('-').map(Number); return new Date(y, m - 1, d, 12); };
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const dm = d => pad(d.getDate()) + '/' + pad(d.getMonth() + 1);
const dayName = d => ['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'][d.getDay()];
const fmt = n => { n = Number(n); if (!n) return ''; return String(Math.round(n * 10) / 10); };
const num = v => (String(v).trim() === '' || isNaN(parseFloat(v))) ? '' : parseFloat(v);
const store = {
  get(k){ try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v){ try { localStorage.setItem(k, v); } catch (e) {} },
  del(k){ try { localStorage.removeItem(k); } catch (e) {} }
};

let API = store.get('api') || API_DEFAULT, CODE = store.get('code') || '', PHONE = store.get('phone') || '';
const isStore = () => S.role === 'store';
const isEng = () => S.role === 'engineer';
const isWorker = () => S.role === 'sprayer' || S.role === 'fertilizer';
const ROLE_NAME = { store: 'مسئول مخزن', engineer: 'مهندس', sprayer: 'مسئول رش', fertilizer: 'مسئول تسميد' };
const cred = () => CODE ? 'code=' + encodeURIComponent(CODE) : 'phone=' + encodeURIComponent(PHONE);
const S = { crops: [], lists: { fert: [], stage: [], spray: [] }, settings: {}, program: new Map(), orders: {},
            tab: 'home', crop: '', week: 1, dirty: false, tCrop: '*', tMode: 'feddan',
            store: { items: [], receipts: [], issues: [], requests: [] }, users: [], sub: 'req', role: 'admin', who: '' };

const startDate = () => parse(S.settings.startDate || '2026-11-01');
const weekStart = w => addDays(startDate(), (w - 1) * 7);
const weekOfIso = s => Math.floor(Math.round((parse(s) - startDate()) / 86400000) / 7) + 1;
const curWeek = () => Math.min(52, Math.max(1, weekOfIso(iso(new Date()))));
const tank = () => S.settings.tank || 1200;
const areaOf = name => (S.crops.find(c => c.name === name) || {}).area || 0;

function toast(msg){ const t = $('#toast'); t.textContent = msg; t.style.display = 'block'; clearTimeout(toast.t); toast.t = setTimeout(() => t.style.display = 'none', 2600); }
function busy(on){ $('#busy').style.display = on ? 'block' : 'none'; }

async function api(action, payload){
  busy(true);
  try {
    let r;
    if (!payload) r = await fetch(API + '?action=' + action + '&' + cred());
    else r = await fetch(API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ action, ...(CODE ? { code: CODE } : { phone: PHONE }), ...payload }) });
    const j = await r.json();
    if (!j.ok) throw new Error(j.error || 'حصل خطأ');
    if (payload && typeof touchCache === 'function') touchCache();
    return j;
  } finally { busy(false); }
}

/* ================= البيانات ================= */
const SU = ['مل', 'لتر', 'جم', 'كجم'];
const blank = () => ({ stage: '', irr: '', freq: '', f: Array.from({ length: 6 }, () => ({ n: '', q: '' })), spray: '', sq: '', su: 'مل', tk: '', mech: '', notes: '' });
const isEmpty = o => !(o.stage || String(o.irr).trim() || String(o.freq).trim() || o.f.some(x => x.n || String(x.q).trim()) || o.spray || String(o.sq).trim() || String(o.tk).trim() || o.mech || o.notes);
const D2 = t => String(t).replace(/[٠-٩]/g, c => c.charCodeAt(0) - 1632).replace('٫', '.').replace('،', '.');
function parseSq(t){
  const m = D2(String(t).trim()).match(/^(\d+(?:[.,]\d+)?)\s*(.*)$/);
  if (!m) return null;
  const q = parseFloat(m[1].replace(',', '.')), u = m[2].trim();
  let su = 'مل';
  if (/^(لتر|ل|لتر\/.*)$/.test(u)) su = 'لتر'; else if (/^(كجم|كيلو|كج)/.test(u)) su = 'كجم'; else if (/^(جم|جرام|غم|جر)/.test(u)) su = 'جم'; else if (/^(مل|سم|cc)/i.test(u)) su = 'مل';
  return { q, su };
}

function rowToObj(r){
  const o = blank();
  o.crop = String(r[0]); o.date = String(r[1]); o.stage = r[2]; o.irr = r[3]; o.freq = r[4];
  for (let i = 0; i < 6; i++) o.f[i] = { n: r[5 + i * 2] || '', q: r[6 + i * 2] };
  o.spray = r[17] || ''; o.sq = r[18]; o.mech = r[19]; o.notes = r[20];
  o.su = (SU.includes(r[21]) || String(r[21] || '').includes('|')) ? r[21] : 'مل'; o.tk = (r[22] === undefined || r[22] === null) ? '' : r[22];
  if (typeof o.sq === 'string' && !o.sq.includes('|') && o.sq.trim() !== '' && isNaN(Number(o.sq))) {
    const p = parseSq(o.sq);
    if (p) { o.sq = p.q; if (!SU.includes(r[21])) o.su = p.su; } else { o.notes = (o.notes ? o.notes + ' | ' : '') + 'كمية الرش: ' + o.sq; o.sq = ''; }
  }
  if (o.spray && String(o.sq).trim() !== '' && String(o.tk).trim() === '') o.tk = 1;
  return o;
}
function objToRow(crop, date, o){
  const r = [crop, date, o.stage, num(o.irr), num(o.freq)];
  o.f.forEach(x => r.push(x.n, num(x.q)));
  const nm = v => String(v).includes('|') ? String(v) : num(v);
  r.push(o.spray, nm(o.sq), o.mech, o.notes, o.su || 'مل', nm(o.tk));
  return r;
}
// إجمالي الرش للصنف: كمية الأتومايزر × عدد الأتومايزرات
// يوم فيه شغل فعلي: ري أو تسميد أو رش أو معاملة ميكانيكية (المرحلة والملاحظات لوحدهم مش شغل)
const hasWork = o => !!(parseFloat(o.irr) > 0 || o.f.some(x => x.n && parseFloat(x.q) > 0) || o.spray || String(o.mech || '').trim());
// الرش ممكن يبقى أكتر من صنف: الأسماء والكميات والوحدات والأعداد متخزنة في نفس الخانات مفصولة بـ " | "
const SPN = 4;
function sprayEach(o){
  const sp = v => String(v === undefined || v === null ? '' : v).split('|').map(s => s.trim());
  const ns = sp(o.spray), qs = sp(o.sq), us = sp(o.su), ts = sp(o.tk), out = [];
  ns.forEach((n, i) => { if (!n) return;
    const q = parseFloat(qs[i]), k = parseFloat(ts[i]);
    out.push({ n, q: q || 0, u: SU.includes(us[i]) ? us[i] : 'مل', k: k || 0, tot: q ? q * (k || 1) : 0 }); });
  return out;
}
function sprayTxt(o){
  return sprayEach(o).map(s => !s.q ? s.n : s.n + ' ' + s.q + ' ' + s.u + '/أتومايزر' + (s.k ? ' × ' + s.k + ' أتومايزر = ' + fmt3(s.q * s.k) + ' ' + s.u : '')).join(' + ');
}
const fmt3 = n => String(Math.round(Number(n) * 1000) / 1000);

// ===== تحميل البيانات: كاش محلي بيفتح الأب فورًا، والتحديث بيتم في الخلفية =====
const CKEY = 'sm_cache_v1';
const idKey = () => (CODE ? 'c:' + CODE : 'p:' + PHONE) + '@' + API;
async function fetchData(){
  if (CODE) { const j = await api('getAll'); return { id: idKey(), role: 'admin', who: '', all: j }; }
  try { const j = await api('getAll'); return { id: idKey(), role: j.role, who: j.name, all: j }; }
  catch (e) { const w = await api('whoami'); if (w.role !== 'store') throw e; const j = await api('getStore'); return { id: idKey(), role: 'store', who: w.name, store: j.store }; }
}
function applyData(d){
  S.role = d.role; S.who = d.who || '';
  if (d.store) { S.store = d.store; S.tab = 'store'; return; }
  const j = d.all;
  S.store = j.store || S.store; S.users = j.users || [];
  if (isEng() && ['store', 'settings'].includes(S.tab)) S.tab = 'home';
  if (isWorker()) S.tab = 'work';
  S.crops = j.crops; S.lists = j.lists; S.settings = j.settings; S.orders = j.orders;
  S.program = new Map();
  j.program.forEach(r => { const o = rowToObj(r); S.program.set(o.crop + '|' + o.date, o); });
  if (!S.crops.find(c => c.name === S.crop)) S.crop = (S.crops[0] || {}).name || '';

function saveCache(d){ try { localStorage.setItem(CKEY, JSON.stringify(d)); } catch (e) {} }
function readCache(){ try { const d = JSON.parse(localStorage.getItem(CKEY) || 'null'); return d && d.id === idKey() ? d : null; } catch (e) { return null; } }
async function load(){ const d = await fetchData(); applyData(d); saveCache(d); }
let _rc; function touchCache(){ clearTimeout(_rc); _rc = setTimeout(async () => { try { saveCache(await fetchData()); } catch (e) {} }, 1500); }
// تحديث في الخلفية بعد ما الأب يفتح من الكاش
async function bgRefresh(){

}

$('#lGo').onclick = async () => {

  if (LMODE === 'admin') { CODE = $('#lCode').value.trim(); PHONE = ''; if (!API || !CODE) { CODE = oc; PHONE = op; $('#lErr').textContent = 'اكتب الرابط والكود'; return; } }

  if (c) { try { applyData(c); startApp(); bgRefresh(); return; } catch (e) { /* كاش بايظ: نحمّل من الأول */ } }
  try { await load(); startApp(); } catch (e) { showLogin(e.message); }

    rows.forEach(r => { if (!r.o) return; sprayEach(r.o).forEach(s => sprayN.add(s.n)); r.o.f.forEach(x => { if (x.n && parseFloat(x.q)) fertN.add(x.n); }); });

    : `<div class="card mut">${'مفيش كميات للأسبوع ده.'}</div>`;
  v.innerHTML = `<div class="card"><b>أهلاً ${esc(S.who || '')}</b> <span class="mut">— ${ROLE_NAME[S.role]} (عرض فقط)</span></div>${weekNav()}

/* ================= الرئيسية ================= */

/* ================= شاشة البرنامج ================= */
let _bal, _balFor;
function getBal(){ if (!_bal || _balFor !== S.store) { _bal = balances(); _balFor = S.store; } return _bal; }
// قوائم التسميد والرش: خانة بحث بالكتابة (بتفلتر بالحروف) بدل القايمة الطويلة
const normAr = t => D2(String(t || '')).toLowerCase().replace(/[ً-ْـ]/g, '').replace(/[أإآٱ]/g, 'ا').replace(/ى/g, 'ي').replace(/ة/g, 'ه').replace(/\s+/g, ' ').trim();
function pickOpts(kind){
  if (S.store.items.length) {
    const B = getBal();
    return S.store.items.slice().sort((x, y) => x.name.localeCompare(y.name, 'ar')).map(i => { const b = B.get(i.name), bal = b ? b.bal : 0;
      return { n: i.name, sub: bal > 0 ? 'الرصيد ' + fmt3(bal) + ' ' + i.unit : '⚠ نفد' }; });
  }
  return S.lists[kind].map(n => ({ n, sub: '' }));
}
function sel(kind, val, key){
  if (kind === 'fert' || kind === 'spray')
    return `<div class="pk"><input class="pki" data-kind="${kind}" data-k="${key}" data-v="${esc(val)}" value="${esc(val)}" placeholder="🔍 اكتب للبحث…" autocomplete="off" autocorrect="off" spellcheck="false"><div class="pkl hid"></div></div>`;
  const NEW = '<option value="__new__">＋ إضافة اسم جديد…</option>';
  const L = S.lists[kind].slice();
  if (val && !L.includes(val)) L.push(val);
  return `<select data-kind="${kind}" data-k="${key}"><option value="">— اختر —</option>${L.map(x => `<option ${x === val ? 'selected' : ''}>${esc(x)}</option>`).join('')}${NEW}</select>`;
}
function pkShow(inp, q){
  const box = inp.nextElementSibling, opts = pickOpts(inp.dataset.kind), words = normAr(q).split(' ').filter(Boolean);
  const hit = opts.filter(o => { const t = normAr(o.n); return words.every(w => t.includes(w)); });
  box.innerHTML = hit.map(o => `<div class="pko" data-n="${esc(o.n)}"><span>${esc(o.n)}</span><small>${esc(o.sub)}</small></div>`).join('')
    + (!hit.length ? (q.trim() ? `<div class="pko pkn" data-new="${esc(q.trim())}">＋ إضافة «${esc(q.trim())}» كاسم جديد (مش في المخزن)</div>` : '<div class="pko mut">مفيش أصناف</div>') : '');
  box.classList.remove('hid');
}
function pkClose(inp){ const b = inp.nextElementSibling; if (b) b.classList.add('hid'); }
function pkSet(inp, name){ inp.value = name; inp.dataset.v = name; pkClose(inp); markDirty(); }
document.addEventListener('focusin', e => { const t = e.target; if (!t.classList || !t.classList.contains('pki')) return;
  t.select(); pkShow(t, ''); setTimeout(() => { try { t.scrollIntoView({ block: 'center', behavior: 'smooth' }); } catch (_) {} }, 350); });
document.addEventListener('input', e => { const t = e.target; if (t.classList && t.classList.contains('pki')) pkShow(t, t.value); });
document.addEventListener('mousedown', e => { if (e.target.closest && e.target.closest('.pkl')) e.preventDefault(); });
document.addEventListener('click', e => { const o = e.target.closest && e.target.closest('.pko'); if (!o) return;
  const inp = o.closest('.pk').querySelector('.pki');
  if (o.dataset.n !== undefined) { pkSet(inp, o.dataset.n); inp.blur(); }
  else if (o.dataset.new) { const n = o.dataset.new, kind = inp.dataset.kind; if (!S.lists[kind].includes(n)) { S.lists[kind].push(n); saveLists(); } pkSet(inp, n); inp.blur(); } });
document.addEventListener('focusout', e => { const t = e.target; if (!t.classList || !t.classList.contains('pki')) return;
  setTimeout(() => {
    pkClose(t);
    const v = t.value.trim();
    if (v === '') { if (t.dataset.v) { t.dataset.v = ''; markDirty(); } t.value = ''; return; }
    if (v === t.dataset.v) return;
    const hit = pickOpts(t.dataset.kind).find(o => normAr(o.n) === normAr(v));
    if (hit) { t.value = hit.n; t.dataset.v = hit.n; markDirty(); return; }
    t.value = t.dataset.v || ''; toast('اختار الصنف من القايمة (أو دوس إضافة كاسم جديد)');
  }, 0); });
function summaryOf(o){
  const p = [];
  if (o.irr) p.push('ري ' + o.irr + 'د×' + (o.freq || 1));
  const nf = o.f.filter(x => x.n).length; if (nf) p.push(nf + ' سماد');
  if (o.spray) p.push('رش');
  if (o.mech) p.push('ميكانيكي');
  return p.join(' · ') || 'فاضي';
}

    return `<div class="sr ${j >= sshown ? 'hid' : ''}"><div>${sel('spray', s.n, 'spray')}</div>

        <div><label>عدد الأتومايزرات</label><input data-k="tk" type="number" inputmode="decimal" step="any" value="${esc(s.k || (s.q && s.n ? 1 : ''))}"></div></div></div>`; }).join('');
  return `<details class="day ${today ? 'today' : ''} ${isEmpty(o) ? '' : 'has'}" data-i="${i}" data-iso="${key}" ${open ? 'open' : ''}>
    <summary><span class="dn">${dayName(d)} ${dm(d)}${today ? ' (النهارده)' : ''}</span><span class="dsum">${esc(summaryOf(o))}</span></summary>
    <div class="body">
      <div><label>المرحلة</label>${sel('stage', o.stage, 'stage')}</div>
      <div class="row2">
        <div><label>مدة الري (دقيقة)</label><input data-k="irr" type="number" inputmode="decimal" step="any" value="${esc(o.irr)}"></div>
        <div><label>عدد الريات في اليوم</label><input data-k="freq" type="number" inputmode="decimal" step="any" value="${esc(o.freq)}"></div>

function readDay(card){
  const g = k => { const e = card.querySelector('[data-k="' + k + '"]'); return e ? e.value : ''; };
  const o = { stage: g('stage'), irr: g('irr'), freq: g('freq'), spray: '', sq: '', su: 'مل', tk: '', mech: g('mech'), notes: g('notes'), f: [], bad: '' };
  const sl = [];
  $$('.sr', card).forEach(r => { const v = k => { const e = r.querySelector('[data-k="' + k + '"]'); return e ? e.value : ''; };
    const n = v('spray'), q = v('sq'), t = v('tk');
    if (!n) { if (String(q).trim() !== '') o.bad = 'name'; return; }
    if (String(q).trim() !== '' && String(t).trim() === '') o.bad = 'tk';
    sl.push([n, q, v('su') || 'مل', t]); });
  if (sl.length) { o.spray = sl.map(x => x[0]).join(' | '); o.sq = sl.map(x => x[1]).join(' | '); o.su = sl.map(x => x[2]).join(' | '); o.tk = sl.map(x => x[3]).join(' | ');
    if (sl.length === 1) { o.sq = sl[0][1]; o.su = sl[0][2]; o.tk = sl[0][3]; } }
  $$('.fr', card).forEach(r => { const n = r.querySelector('[data-k="fn"]'); if (n) o.f.push({ n: n.value, q: r.querySelector('[data-k="fq"]').value }); });
  return o;
}

async function saveWeek(){
  const cards = $$('#days .day'), rows = [], dates = [];
  for (const c of cards) {
    const o = readDay(c); dates.push(c.dataset.iso);
    if (o.f.some(x => String(x.q).trim() !== '' && !x.n)) { c.open = true; toast('اختار اسم السماد للكمية المكتوبة'); return; }
    if (o.bad === 'name') { c.open = true; toast('اختار صنف الرش للكمية المكتوبة'); return; }
    if (o.bad === 'tk') { c.open = true; toast('اكتب عدد الأتومايزرات للرش'); return; }
    if (!isEmpty(o)) rows.push(objToRow(S.crop, c.dataset.iso, o));
  }
  try {
    const area = (S.crops.find(c => c.name === S.crop) || {}).area || 0;
    const lines = linesFor(S.crop, area, rows.map(r => rowToObj(r)));
    await api('saveDays', { crop: S.crop, week: S.week, lines, dates, rows });
    dates.forEach(d => S.program.delete(S.crop + '|' + d));
    rows.forEach(r => { const o = rowToObj(r); S.program.set(o.crop + '|' + o.date, o); });
    S.dirty = false; const b = $('#sbar'); if (b) b.classList.remove('dirty');

    cards.forEach(c => { const o = readDay(c); c.classList.toggle('has', !isEmpty(o)); c.querySelector('.dsum').textContent = summaryOf(o); });
  } catch (e) { toast('الحفظ فشل: ' + e.message); }
}

function aggregate(){
  const res = {}; S.crops.forEach(c => res[c.name] = new Map());
  for (const o of S.program.values()) {
    if (!res[o.crop]) continue;
    const w = weekOfIso(o.date); if (w < 1 || w > 52) continue;
    for (const x of o.f) {
      const q = parseFloat(x.q); if (!x.n || !q) continue;
      let a = res[o.crop].get(x.n); if (!a) { a = new Array(53).fill(0); res[o.crop].set(x.n, a); }
      a[w] += q;
    }
  }
  return res;
}

function waText(){
  const w = S.week, ws = weekStart(w), od = S.orders[w] || {};
  let t = `*أمر تشغيل أسبوعي — أسبوع ${w}* (${dm(ws)} – ${dm(addDays(ws, 6))})\nالحالة: ${statusLabel(od.status)}\n`;
  if (od.engineer) t += `مهندس التنفيذ: ${od.engineer}\n`;
  if (od.manager) t += `مدير المزرعة: ${od.manager}\n`;
  sections(w).forEach(s => {
    t += `\n*${s.c.name}* (${s.c.area} فدان)\n`;
    s.rows.forEach(r => {
      const o = r.o; if (!o || isEmpty(o)) return; const p = [];
      if (o.stage) p.push(o.stage);
      if (o.irr) p.push(`ري ${o.irr} د × ${o.freq || 1}`);
      const fs = o.f.filter(x => x.n && parseFloat(x.q));
      if (fs.length) p.push('تسميد: ' + fs.map(x => `${x.n} ${fmt(x.q * s.c.area)} كجم`).join('، '));
      if (o.spray) p.push('رش: ' + sprayTxt(o));
      if (o.mech) p.push('ميكانيكي: ' + o.mech);
      if (o.notes) p.push('ملاحظات: ' + o.notes);
      t += `${dayName(r.d)} ${dm(r.d)}: ${p.join(' | ')}\n`;
    });
  });
  return t;
}
// ===== طلبات الصرف اللي بتتولد من أمر التشغيل =====
const FAM = { 'مل': ['لتر', 1000], 'لتر': ['لتر', 1], 'جم': ['كجم', 1000], 'كجم': ['كجم', 1] };
const itemOf = n => S.store.items.find(i => i.name === n);
function linesFor(crop, area, objs){
  const m = new Map(), put = (item, unit, qty) => { const a = m.get(item) || { item, unit, qty: 0 }; a.qty += qty; m.set(item, a); };
  objs.forEach(o => {
    if (!o) return;
    o.f.forEach(x => { const q = parseFloat(x.q); if (!x.n || !q) return; const it = itemOf(x.n); put(x.n, it ? it.unit : 'كجم', q * area); });
    sprayEach(o).forEach(s => { if (!s.tot) return; const [bu, dv] = FAM[s.u] || ['لتر', 1000]; put(s.n, bu, s.tot / dv); });
  });
  return [...m.values()].map(l => ({ ...l, qty: Math.round(l.qty * 1000) / 1000 })).filter(l => l.qty > 0);
}
function buildLines(w){
  const out = [];
  sections(w).forEach(sc => linesFor(sc.c.name, sc.c.area, sc.rows.map(r => r.o)).forEach(l => out.push({ crop: sc.c.name, ...l })));
  return out;
}
async function setStatus(st, withLines){

  const rec = { week: S.week, status: st, engineer: $('#oEng').value.trim(), manager: $('#oMgr').value.trim(), note: $('#oNote').value.trim() };
  if (st === 'approved' && (prev !== 'approved' || withLines)) rec.lines = buildLines(S.week);
  try {
    const j = await api('saveOrder', rec);
    if (j.store) S.store = j.store;
    S.orders[S.week] = { status: st, engineer: rec.engineer, manager: rec.manager, note: rec.note, updated: new Date().toISOString() };
    toast(rec.lines ? 'اتحفظ — اتبعتت ' + rec.lines.length + ' طلب صرف للمخزن' : 'اتحفظ'); render();
  } catch (e) { toast('فشل: ' + e.message); }
}

  const get = n => m.get(n);
  S.store.receipts.forEach(r => { const b = get(r.item); if (b) b.inn += r.qty; });
  S.store.issues.forEach(r => { const b = get(r.item); if (b) b.out += r.qty; });
  const cw = curWeek();
  S.store.requests.forEach(r => { if (r.status !== 'done' && r.week <= cw + 1) { const b = get(r.item); if (b) b.need += r.need; } });
  m.forEach(b => { b.bal = b.opening + b.inn - b.out; });
  return m;
}

async function storeCall(action, payload, okMsg){
  try { const j = await api(action, payload); if (j.store) S.store = j.store; if (okMsg) toast(okMsg); render(true); }
  catch (e) { toast('فشل: ' + e.message); }
}
async function storeAct(act, b){
  switch (act) {
    case 'sub': S.sub = b.dataset.sub; render(); break;
    case 'issue': {
      const box = b.closest('.reql'), q = parseFloat($('.iq', box).value);
      if (!(q >= 0)) { toast('اكتب الكمية'); break; }
      await storeCall('storeIssue', { lineId: b.dataset.id, qty: q, note: $('.in', box).value.trim() }, 'اتسجل الصرف'); break;
    }
    case 'unissue': if (confirm('تلغي الصرف ده؟ الكمية هترجع للرصيد.')) await storeCall('storeUnissue', { lineId: b.dataset.id }, 'اتلغى الصرف'); break;
    case 'receipt': {
      const item = $('#rItem').value, qty = parseFloat($('#rQty').value);
      if (!item || !(qty > 0)) { toast('اختار الصنف واكتب الكمية'); break; }
      await storeCall('storeReceipt', { item, qty, date: $('#rDate').value, note: $('#rNote').value.trim() }, 'اتسجل الوارد'); break;
    }
    case 'delreceipt': if (confirm('تمسح الوارد ده؟')) await storeCall('storeDeleteReceipt', { id: b.dataset.id }, 'اتمسح'); break;
    case 'manualissue': {
      const item = $('#xItem').value, qty = parseFloat($('#xQty').value);
      if (!item || !(qty > 0)) { toast('اختار الصنف واكتب الكمية'); break; }
      await storeCall('storeManualIssue', { item, qty, date: $('#xDate').value, to: $('#xTo').value.trim(), note: $('#xNote').value.trim() }, 'اتسجل الصرف'); break;
    }
    case 'delissue': if (confirm('تمسح الصرف ده؟')) await storeCall('storeDeleteIssue', { id: b.dataset.id }, 'اتمسح'); break;
    case 'additem': $('#itemRows').insertAdjacentHTML('beforeend', itemRow({ name: '', type: '', unit: 'كجم', opening: '' })); break;
    case 'delitem': if (confirm('تشيل الصنف ده من القايمة؟')) b.closest('.itemrow').remove(); break;
    case 'saveitems': {
      const items = $$('.itemrow').map(r => ({ name: $('.in2', r).value.trim(), type: $('.it', r).value.trim(), unit: $('.iu', r).value, opening: parseFloat($('.io', r).value) || 0 })).filter(i => i.name);
      if (new Set(items.map(i => i.name)).size !== items.length) { toast('فيه اسمين متكررين'); break; }
      await storeCall('storeSaveItems', { items }, 'اتحفظت الأصناف'); break;
    }
    case 'importerp': {
      const have = new Set($$('.in2').map(x => x.value.trim())); let n = 0;
      ERP_ITEMS.split(';').forEach(t => { const [name, q, u] = t.split('|'); if (have.has(name)) return; have.add(name); n++;
        $('#itemRows').insertAdjacentHTML('beforeend', itemRow({ name, type: 'أسمدة ومبيدات', unit: u === 'K' ? 'كجم' : 'لتر', opening: parseFloat(q) })); });
      toast(n ? 'اتضاف ' + n + ' صنف برصيدهم — راجع واضغط حفظ الأصناف' : 'كلهم موجودين'); break;
    }
    case 'importitems': {
      const have = new Set($$('.in2').map(x => x.value.trim())); let n = 0;
      const add = (list, type, unit) => list.forEach(x => { if (!have.has(x)) { have.add(x); n++; $('#itemRows').insertAdjacentHTML('beforeend', itemRow({ name: x, type, unit, opening: '' })); } });
      add(S.lists.fert, 'سماد', 'كجم'); add(S.lists.spray, 'مبيد / رش', 'لتر');
      toast(n ? 'اتضاف ' + n + ' صنف — راجع الوحدات واضغط حفظ' : 'مفيش جديد'); break;
    }
  }
}

const linesOf = id => [...new Set($('#' + id).value.split('\n').map(x => x.trim()).filter(Boolean))];

/* ================= الأحداث ================= */
const view = $('#view');
view.addEventListener('input', e => { if (S.tab === 'program' && e.target.closest('#days')) markDirty(); });
view.addEventListener('change', e => {
  const t = e.target;
  if (t.id === 'cropSel') { if (S.dirty && !confirm('فيه تعديلات متحفظتش. تكمل من غير حفظ؟')) { t.value = S.crop; return; } S.crop = t.value; render(); return; }
  if (t.id === 'wsel') { setWeek(parseInt(t.value)); return; }
  if (t.id === 'tMode') { S.tMode = t.value; render(); return; }
  if (t.id === 'tCrop') { S.tCrop = t.value; render(); return; }
  if (t.dataset && t.dataset.kind && t.value === '__new__') { onSelChange(t); markDirty(); }
});
view.addEventListener('click', async e => {
  const st = e.target.closest('[data-st]'); if (st) { setStatus(st.dataset.st, !!st.dataset.lines); return; }
  const b = e.target.closest('[data-act]'); if (!b) return;
  const act = b.dataset.act, card = b.closest('details.day');
  switch (act) {
    case 'editcrop': S.crop = b.dataset.crop; S.tab = 'program'; renderNav(); render(); break;
    case 'wprev': setWeek(S.week - 1); break;
    case 'wnext': setWeek(S.week + 1); break;
    case 'save': saveWeek(); break;
    case 'copyweek': openCopy(); break;
    case 'moresp': { const h = $('.sr.hid', card); if (h) h.classList.remove('hid'); else toast('وصلت للحد الأقصى ' + SPN); break; }
    case 'morefert': { const h = $('.fr.hid', card); if (h) h.classList.remove('hid'); else toast('وصلت للحد الأقصى 6'); break; }
    case 'clearday': { if (!confirm('تمسح بيانات اليوم ده؟')) break; const open = card.open; card.outerHTML = dayCard(+card.dataset.i, blank(), open); markDirty(); break; }
    case 'copyprev': {
      const i = +card.dataset.i; let prev;
      if (i > 0) prev = readDay($('#days .day[data-i="' + (i - 1) + '"]'));
      else prev = S.program.get(S.crop + '|' + iso(addDays(weekStart(S.week), -1)));
      if (!prev || isEmpty(prev)) { toast('اليوم السابق فاضي'); break; }
      card.outerHTML = dayCard(i, prev, true); markDirty(); break;
    }
    case 'wa': { const t = waText(); if (navigator.share) { try { await navigator.share({ text: t }); } catch (x) {} } else { try { await navigator.clipboard.writeText(t); toast('اتنسخ — الصقه في الواتساب'); } catch (x) { prompt('انسخ النص:', t); } } break; }
    case 'savestart': {
      const val = $('#sStart').value; if (!val) break;
      try { await api('saveSetting', { key: 'startDate', value: val }); S.settings.startDate = val; S.week = curWeek(); toast('اتحفظ'); } catch (x) { toast('فشل: ' + x.message); } break;
    }
    case 'addcrop': $('#cropRows').insertAdjacentHTML('beforeend', cropRow('', '', '')); break;
    case 'delcrop': if (confirm('تمسح المحصول ده من القايمة؟ (بياناته هتفضل في الشيت)')) b.closest('.croprow').remove(); break;
    case 'savecrops': {
      const crops = $$('.croprow').map(r => ({ name: $('.cn', r).value.trim(), area: parseFloat($('.ca', r).value) || 0, old: r.dataset.old })).filter(c => c.name);
      if (new Set(crops.map(c => c.name)).size !== crops.length) { toast('فيه اسمين متكررين'); break; }
      try {
        await api('saveCrops', { crops });
        const ren = {}; crops.forEach(c => { if (c.old && c.old !== c.name) ren[c.old] = c.name; });
        if (Object.keys(ren).length) { const m = new Map(); S.program.forEach(o => { if (ren[o.crop]) o.crop = ren[o.crop]; m.set(o.crop + '|' + o.date, o); }); S.program = m; if (ren[S.crop]) S.crop = ren[S.crop]; }
        S.crops = crops.map(c => ({ name: c.name, area: c.area }));
        if (!S.crops.find(c => c.name === S.crop)) S.crop = (S.crops[0] || {}).name || '';
        toast('اتحفظت المحاصيل'); render();
      } catch (x) { toast('فشل: ' + x.message); } break;
    }
    case 'savelists': {
      S.lists = { fert: linesOf('lsFert'), stage: linesOf('lsStage'), spray: linesOf('lsSpray') };
      try { await api('saveLists', S.lists); toast('اتحفظت القوائم'); } catch (x) { toast('فشل: ' + x.message); } break;
    }
    case 'adduser': $('#userRows').insertAdjacentHTML('beforeend', userRow('', '', 'store')); break;
    case 'deluser': b.closest('.userrow').remove(); break;
    case 'saveusers': {
      const users = $$('.userrow').map(r => ({ name: $('.un', r).value.trim(), phone: $('.up', r).value.trim(), role: $('.ur', r).value })).filter(u => u.name || u.phone);
      if (users.some(u => !u.name || D2(u.phone).replace(/\D/g, '').length < 10)) { toast('اكتب اسم ورقم موبايل صحيح لكل واحد'); break; }
      try { await api('saveUsers', { users }); S.users = users; toast('اتحفظ'); } catch (x) { toast('فشل: ' + x.message); } break;
    }
    case 'logout': if (confirm('هتدخل الرابط والكود من جديد؟')) { store.del('api'); store.del('code'); store.del('phone'); try { localStorage.removeItem(CKEY); } catch (e) {} API = API_DEFAULT; CODE = ''; PHONE = ''; showLogin(); } break;
    default: storeAct(act, b);
  }
});

if ('serviceWorker' in navigator) {
  const had = !!navigator.serviceWorker.controller; let rl = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => { if (had && !rl && !(S && S.dirty)) { rl = true; location.reload(); } });
  navigator.serviceWorker.register('sw.js').then(r => r.update()).catch(() => {});
}
boot();
</script>
</body>
</html>
